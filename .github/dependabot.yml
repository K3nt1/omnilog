# Mises à jour automatiques hebdomadaires, toujours proposées sur develop.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci
      include: scope        # titre des PR : "ci(deps): bump ..."

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: build
      include: scope        # titre des PR : "build(deps): bump ..."
    groups:
      # Les mises à jour mineures et correctifs arrivent en une seule PR groupée
      mineures-et-correctifs:
        update-types: [minor, patch]