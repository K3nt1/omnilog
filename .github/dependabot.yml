# Mises à jour automatiques hebdomadaires, toujours proposées sur develop.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci
      include: scope        # titre des PR : "ci(deps): bump ..."

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: build
      include: scope        # titre des PR : "build(deps): bump ..."
    groups:
      # Les mises à jour mineures et correctifs arrivent en une seule PR groupée
      mineures-et-correctifs:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (via eslint-config-next) n'accepte que typescript < 6.1
      - dependency-name: "typescript"
        versions: [">= 6.1"]
      # Les types Node doivent suivre la version majeure de Node utilisée (22)
      - dependency-name: "@types/node"
        versions: [">= 23"]
      # eslint-config-next 16 (plugins import, jsx-a11y, react) n'accepte qu'eslint <= 9
      - dependency-name: "eslint"
        versions: [">= 10"]