# Chaque merge dans develop => migrations + déploiement sur le Worker de staging.
name: Deploy staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://omnilog-staging.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrations D1 (staging)
        run: npx wrangler d1 migrations apply DB --remote --env staging

      - name: Build et déploiement
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy -- --env=staging
