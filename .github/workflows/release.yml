# Sur main :
#  1. release-please tient à jour une "Release PR" (version + CHANGELOG).
#  2. Quand tu merges cette Release PR => tag vX.Y.Z + GitHub Release,
#     puis migrations + déploiement en production.
#  3. Une PR "sync main -> develop" est ouverte pour récupérer le bump de version.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # PAT obligatoire : avec GITHUB_TOKEN, la CI ne se lancerait pas sur la Release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-production:
    name: Production
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://omnilog.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrations D1 (production)
        run: npx wrangler d1 migrations apply DB --remote --env=""

      - name: Build et déploiement
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy -- --env=""

  sync-develop:
    name: Sync main -> develop
    needs: [release-please, deploy-production]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ouvrir la PR de synchronisation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh pr create --base develop --head main \
            --title "chore: synchroniser develop avec la release $TAG" \
            --body "Récupère le bump de version et le CHANGELOG de $TAG dans develop. À merger en **merge commit** (pas en squash)." \
            || echo "Rien à synchroniser ou PR déjà ouverte."
