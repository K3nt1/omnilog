# Impose un titre de PR au format Conventional Commits
# et commente la liste des fichiers modifiés.
name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  title:
    name: Titre conventionnel
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          requireScope: false
          subjectPattern: ^[a-zà-ÿ].+$
          subjectPatternError: |
            La description "{subject}" doit commencer par une minuscule.

  files:
    name: Liste des fichiers modifiés
    runs-on: ubuntu-latest
    if: github.event.action != 'edited' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- files-changed-bot -->';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const icon = { added: '🟢', modified: '🟡', removed: '🔴', renamed: '🔵' };
            const rows = files.map(f =>
              `| ${icon[f.status] ?? '⚪'} ${f.status} | \`${f.filename}\` | +${f.additions} / -${f.deletions} |`);
            const body = [
              marker,
              `### 📁 Fichiers modifiés (${files.length})`,
              '',
              '| Statut | Fichier | Lignes |',
              '|---|---|---|',
              ...rows,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
