# Vérifie chaque PR (vers develop ou main) : lint, types, build Cloudflare.
name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # Build complet pour Workers : échoue aussi si le Worker dépasse 3 Mio.
      - name: Build OpenNext
        run: npx opennextjs-cloudflare build

      # Déploiement à blanc : rien n'est envoyé, Wrangler calcule la taille réelle
      # et échoue si la limite du plan gratuit (3 Mio compressé) est dépassée.
      - name: Taille du Worker
        run: |
          npx wrangler deploy --dry-run --outdir .dry-run | tee dry-run.log
          echo '### Taille du Worker (limite gratuite : 3072 KiB gzip)' >> "$GITHUB_STEP_SUMMARY"
          grep -i "Total Upload" dry-run.log >> "$GITHUB_STEP_SUMMARY" || true
